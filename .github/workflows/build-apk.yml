name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build:web

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android microphone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if permission not in s:
              s = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  s,
                  count=1
              )

          manifest.write_text(s)
          PY

          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN" | sed 's/package //;s/;//')

          cat > "$MAIN" <<JAVA
          package $PACKAGE;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int MIC_PERMISSION_REQUEST = 5001;

              private PermissionRequest pendingPermissionRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(() -> {

                              boolean wantsAudio = false;

                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                      wantsAudio = true;
                                      break;
                                  }
                              }

                              if (!wantsAudio) {
                                  request.deny();
                                  return;
                              }

                              if (checkSelfPermission(
                                      Manifest.permission.RECORD_AUDIO)
                                      == PackageManager.PERMISSION_GRANTED) {

                                  request.grant(new String[] {
                                      PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                  });

                              } else {
                                  pendingPermissionRequest = request;

                                  requestPermissions(
                                      new String[] {
                                          Manifest.permission.RECORD_AUDIO
                                      },
                                      MIC_PERMISSION_REQUEST
                                  );
                              }
                          });
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode != MIC_PERMISSION_REQUEST) {
                      return;
                  }

                  PermissionRequest request = pendingPermissionRequest;
                  pendingPermissionRequest = null;

                  if (request == null) {
                      return;
                  }

                  if (grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                      request.grant(new String[] {
                          PermissionRequest.RESOURCE_AUDIO_CAPTURE
                      });

                  } else {
                      request.deny();
                  }
              }
          }
          JAVA

          echo "===== MANIFEST ====="
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml

          echo "===== MAIN ACTIVITY ====="
          cat "$MAIN"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mic-boost-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
