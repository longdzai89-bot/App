name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build:web

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'

          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application", permission + "    <application", 1)

          p.write_text(s)
          PY

      - name: Configure microphone runtime permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/micboost/app/MainActivity.java")
          p.parent.mkdir(parents=True, exist_ok=True)

          code = """package com.micboost.app;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.webkit.PermissionRequest;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private static final int MIC_PERMISSION = 1001;

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(
                new String[]{Manifest.permission.RECORD_AUDIO},
                MIC_PERMISSION
            );
        }

        getBridge().getWebView().setWebChromeClient(
            new android.webkit.WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                    runOnUiThread(() -> {
                        request.grant(request.getResources());
                    });
                }
            }
        );
    }
}
"""

          p.write_text(code)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mic-boost-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
